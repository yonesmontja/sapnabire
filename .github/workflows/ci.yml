name: CI

on:
  push:
  pull_request:

jobs:
  core-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduerp
          POSTGRES_PASSWORD: eduerp
          POSTGRES_DB: eduerp_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eduerp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  assessment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/assessment
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduerp
          POSTGRES_PASSWORD: eduerp
          POSTGRES_DB: eduerp_assessment
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eduerp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/assessment/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

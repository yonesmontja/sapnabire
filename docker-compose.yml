# Infrastruktur lokal: PostgreSQL 16 + Redis 7 + Mailpit.
# Aplikasi (Laravel, Django, Next.js) dijalankan langsung di mesin agar hot-reload cepat.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduerp
      POSTGRES_PASSWORD: eduerp
      POSTGRES_DB: eduerp
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduerp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
